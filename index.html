<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GI Joe Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:        #0d0f14;
  --surface:   #13161e;
  --surface2:  #1a1e2a;
  --surface3:  #1f2435;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.12);
  --joe:       #3b82f6;
  --joe-dim:   rgba(59,130,246,0.15);
  --joe-text:  #93c5fd;
  --cobra:     #ef4444;
  --cobra-dim: rgba(239,68,68,0.15);
  --cobra-text:#fca5a5;
  --text:      #e2e8f0;
  --text2:     #94a3b8;
  --text3:     #475569;
  --green:     #22c55e;
  --amber:     #f59e0b;
  --red:       #ef4444;
  --radius-sm: 8px;
  --radius:    12px;
  --radius-lg: 16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* TOPBAR */
.topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;position:sticky;top:0;z-index:100;flex-shrink:0}
.logo{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:16px;color:var(--text);letter-spacing:-0.3px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--joe)}
.search-wrap{flex:1;max-width:380px;position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 30px 8px 34px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.15s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--border2)}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:4px 6px;line-height:1;border-radius:5px;transition:all 0.1s}
.search-clear:hover{color:var(--text);background:var(--surface3)}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.sync-status{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:var(--red)}
.sync-dot.busy{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--radius-sm);border:none;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.btn-primary{background:var(--joe);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn:disabled{opacity:0.5;cursor:not-allowed}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:208px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:4px}
.sidebar-section{padding:0 10px;margin-bottom:8px}
.sidebar-heading{font-size:10px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);padding:0 6px;margin-bottom:4px}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 10px 8px}
.stat-card .num{font-family:'Inter Tight',sans-serif;font-size:22px;font-weight:700;color:var(--text);line-height:1}
.stat-card .lbl{font-size:10px;color:var(--text3);margin-top:3px}
.filter-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:var(--radius-sm);font-size:13px;color:var(--text2);cursor:pointer;transition:all 0.1s;border:1px solid transparent;user-select:none}
.filter-item:hover{background:var(--surface2);color:var(--text)}
.filter-item.active{background:var(--surface2);color:var(--text);border-color:var(--border)}
.filter-item .count{font-size:11px;color:var(--text3)}
.filter-item.active .count{color:var(--text2)}
.faction-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;flex-shrink:0}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;align-items:center;gap:10px}
.view-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0}
.view-btn{background:transparent;border:none;color:var(--text3);padding:6px 10px;cursor:pointer;font-size:15px;transition:all 0.1s;display:flex;align-items:center}
.view-btn.active{background:var(--surface3);color:var(--text)}
.sort-select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-family:'Inter',sans-serif;font-size:12px;padding:6px 10px;outline:none;cursor:pointer}
.sort-select option{background:var(--surface2)}
.result-count{font-size:12px;color:var(--text3);margin-left:auto}

/* CARD GRID */
.year-divider{display:flex;align-items:center;gap:10px}
.year-divider-label{font-family:'Inter Tight',sans-serif;font-size:14px;font-weight:700;color:var(--text);letter-spacing:0.2px;white-space:nowrap}
.year-divider-count{font-size:11px;color:var(--text3);white-space:nowrap}
.year-divider-line{flex:1;height:1px;background:var(--border)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fig-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:border-color 0.15s,transform 0.15s;display:flex;flex-direction:column}
.fig-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.card-top-stripe{height:3px;flex-shrink:0}
.card-top-stripe.joe{background:var(--joe)}
.card-top-stripe.cobra{background:var(--cobra)}
.card-img-area{height:120px;display:flex;align-items:center;justify-content:center;background:var(--surface2);position:relative;overflow:hidden;flex-shrink:0}
.card-img-area img{width:100%;height:100%;object-fit:contain}
.card-no-img{font-size:11px;color:var(--text3)}
.card-year-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);color:var(--text2);font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.card-photo-count{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,0.55);color:var(--text2);font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;display:flex;align-items:center;gap:3px}
.img-expand-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.25);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.15s,background 0.15s}
.card-img-area:hover .img-expand-btn{opacity:1}
.img-expand-btn:hover{background:rgba(0,0,0,0.8)}
.card-body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:8px}
.card-name{font-family:'Inter Tight',sans-serif;font-size:14px;font-weight:600;color:var(--text);line-height:1.2}
.card-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px}
.tag-joe{background:var(--joe-dim);color:var(--joe-text)}
.tag-cobra{background:var(--cobra-dim);color:var(--cobra-text)}
.tag-sub{background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.tag-wanted{background:rgba(234,179,8,0.15);color:#eab308;border:1px solid rgba(234,179,8,0.35)}
.tag-oob{background:rgba(148,163,184,0.15);color:#94a3b8;border:1px solid rgba(148,163,184,0.35)}
.pips{display:flex;gap:3px;align-items:center}
.pip{flex:1;height:4px;border-radius:2px;background:var(--surface3)}
.pip.on-joe{background:var(--joe)}
.pip.on-cobra{background:var(--cobra)}
.pip.on-amber{background:var(--amber)}
.cond-label{font-size:10px;color:var(--text3);white-space:nowrap}
.card-footer{padding:8px 14px 12px;display:flex;align-items:center;justify-content:space-between}
.acc-label{font-size:11px;color:var(--text3)}
.acc-label.complete{color:var(--green)}
.acc-label.missing{color:var(--amber)}
.edit-btn{font-size:11px;font-weight:500;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 9px;cursor:pointer;transition:all 0.1s}
.edit-btn:hover{color:var(--text);border-color:var(--border2)}

/* LIST VIEW */
.list-view{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.list-header,.list-row{display:grid;grid-template-columns:10px 1fr 56px 130px 170px 70px;gap:12px;align-items:center;padding:10px 16px}
.list-header{background:var(--surface2);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--text3)}
.list-row{background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;transition:background 0.1s}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:var(--surface2)}
.list-stripe{width:3px;height:28px;border-radius:2px;flex-shrink:0}
.list-stripe.joe{background:var(--joe)}
.list-stripe.cobra{background:var(--cobra)}
.list-name{font-weight:500;color:var(--text)}
.list-sub{font-size:11px;color:var(--text3);margin-top:1px}
.list-pips{display:flex;gap:2px}
.list-pip{width:7px;height:7px;border-radius:50%;background:var(--surface3)}
.list-pip.on-joe{background:var(--joe)}
.list-pip.on-cobra{background:var(--cobra)}
.list-pip.on-amber{background:var(--amber)}
.list-missing{font-size:10px;color:var(--amber);margin-top:2px;line-height:1.4}
.list-year-divider{padding:7px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:8px}
.list-year-divider:first-of-type{border-top:none}
.list-year-label{font-family:'Inter Tight',sans-serif;font-size:12px;font-weight:700;color:var(--text2);letter-spacing:0.3px}
.list-year-count{font-size:11px;color:var(--text3)}
.note-flag{display:inline-flex;vertical-align:middle;margin-left:6px;color:var(--text3);cursor:help}
.list-row:hover .note-flag{color:var(--joe-text)}
.photo-flag{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;margin-left:6px;color:var(--text3);cursor:pointer}
.photo-flag:hover{color:var(--joe-text)}
.photo-flag-count{font-size:10px;font-weight:600}

/* EMPTY */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:80px 20px;text-align:center}
.empty-icon{font-size:40px;opacity:0.3}
.empty-title{font-family:'Inter Tight',sans-serif;font-size:18px;font-weight:600;color:var(--text2)}
.empty-sub{font-size:13px;color:var(--text3);max-width:280px;line-height:1.6}

/* LOADING */
.loading{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text3);font-size:13px}
.spinner{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--joe);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,0.6)}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:10}
.modal-title{font-family:'Inter Tight',sans-serif;font-size:18px;font-weight:600;color:var(--text)}
.modal-sub{font-size:12px;color:var(--text3);margin-top:2px}
.modal-close{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);width:28px;height:28px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.1s;flex-shrink:0}
.modal-close:hover{background:var(--surface3);color:var(--text)}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.modal-section{font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);padding-bottom:10px;border-bottom:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.span2{grid-column:1/-1}
.form-label{font-size:11px;font-weight:500;color:var(--text2)}
.form-input,.form-select,.form-textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;outline:none;width:100%;transition:border-color 0.15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--joe)}
.form-input::placeholder{color:var(--text3)}
.form-textarea{resize:vertical;min-height:72px}
.form-select option{background:var(--surface2)}
.pip-editor{display:flex;flex-direction:column;gap:8px}
.pip-row{display:flex;gap:4px;align-items:center}
.pip-edit{flex:1;height:8px;border-radius:4px;background:var(--surface3);cursor:pointer;transition:all 0.1s;border:none}
.pip-description{font-size:11px;color:var(--text3)}
.pip-value{font-family:'Inter Tight',sans-serif;font-size:18px;font-weight:700;color:var(--text);min-width:28px;text-align:right}
.acc-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.acc-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.1s;user-select:none}
.acc-item:hover{border-color:var(--border2)}
.acc-item.owned{border-color:var(--green);color:var(--text)}
.acc-item input{accent-color:var(--green);cursor:pointer}
.img-upload{border:1px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all 0.15s;position:relative}
.img-upload:hover{border-color:var(--joe);background:var(--joe-dim)}
.img-upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.img-upload-text{font-size:12px;color:var(--text3);line-height:1.7}
.img-upload-icon{font-size:22px;margin-bottom:4px;opacity:0.5}
.img-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.img-thumb{width:64px;height:64px;border-radius:var(--radius-sm);overflow:hidden;position:relative;border:1px solid var(--border)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-thumb-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.img-thumb .uploading-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.modal-footer .spacer{flex:1}

/* LIGHTBOX */
.lightbox-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox{max-width:min(900px,92vw);max-height:92vh;display:flex;flex-direction:column;gap:12px}
.lightbox-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lightbox-title{font-family:'Inter Tight',sans-serif;font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px}
.lightbox-count{font-size:12px;font-weight:500;color:var(--text3)}
.lightbox-body{display:flex;align-items:center;gap:10px;min-height:0}
.lightbox-img-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:200px;max-height:75vh;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lightbox-img{max-width:100%;max-height:75vh;object-fit:contain;display:block}
.lightbox-nav{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.1s}
.lightbox-nav:hover{background:var(--surface3);border-color:var(--joe)}
.lightbox-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.lightbox-thumb{flex-shrink:0;width:54px;height:54px;border-radius:var(--radius-sm);overflow:hidden;border:2px solid transparent;background:var(--surface2);cursor:pointer;padding:0;transition:border-color 0.1s}
.lightbox-thumb:hover{border-color:var(--border2)}
.lightbox-thumb.active{border-color:var(--joe)}
.lightbox-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* MIGRATE BANNER */
.migrate-banner{background:var(--surface2);border:1px solid var(--amber);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:12px;font-size:13px}
.migrate-banner-text{flex:1;color:var(--text2);line-height:1.5}
.migrate-banner-text strong{color:var(--text)}

/* TOASTS */
.toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--text);animation:toastIn 0.2s ease;display:flex;align-items:center;gap:8px}
.toast::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}
.toast.success::before{background:var(--green)}
.toast.error::before{background:var(--red)}
.toast.info::before{background:var(--joe)}
@keyframes toastIn{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
</style>
</head>

<script>

const SB_URL  = 'https://djkmpqxratnahyavfjau.supabase.co';

// Core fetch — uses user access token when signed in, anon key otherwise
async function sbFetch(path, options = {}) {
  const authToken = currentAccessToken || SB_KEY;
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${authToken}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...options.headers,
    },
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ── DB HELPERS ────────────────────────────────────────────────────────────────
// Convert DB row (snake_case, arrays) → app figure (camelCase)
function fromRow(r) {
  return {
    id:               r.id,
    name:             r.name,
    codename:         r.codename || '',
    faction:          r.faction,
    year:             r.year,
    status:           r.status || 'owned',
    subgroup:         r.subgroup || '',
    vehicle:          r.vehicle || '',
    condition:        r.condition,
    accessories:      r.accessories || [],
    accessoriesOwned: r.accessories_owned || [],
    notes:            r.notes || '',
    acquisitionDate:  r.acquisition_date || '',
    acquisitionPrice: r.acquisition_price || '',
    images:           r.images || [],
    createdAt:        r.created_at,
    updatedAt:        r.updated_at,
  };
}

// Convert app figure → DB row
function toRow(f) {
  const row = {
    name:             f.name,
    codename:         f.codename || null,
    faction:          f.faction,
    year:             f.year || null,
    status:           f.status || 'owned',
    subgroup:         f.subgroup || null,
    vehicle:          f.vehicle || null,
    condition:        f.condition || 7,
    accessories:      f.accessories || [],
    accessories_owned:f.accessoriesOwned || [],
    notes:            f.notes || null,
    acquisition_date: f.acquisitionDate || null,
    acquisition_price:f.acquisitionPrice ? parseFloat(f.acquisitionPrice) : null,
    images:           f.images || [],
  };
  return row;
}

async function dbFetch() {
  const rows = await sbFetch('figures?select=*');
  return (rows || []).map(fromRow);
}

async function dbInsert(fig) {
  const rows = await sbFetch('figures', { method: 'POST', body: JSON.stringify(toRow(fig)) });
  return fromRow(rows[0]);
}

// Insert/update with an explicit, partial set of already-snake_case DB columns
// (bypasses toRow()'s defaults) — used by CSV import so it only ever touches
// the catalog fields the CSV governs, and never clobbers condition, photos,
// notes or acquisition details with toRow()'s fallback values.
async function dbInsertFields(fields) {
  const rows = await sbFetch('figures', { method: 'POST', body: JSON.stringify(fields) });
  return fromRow(rows[0]);
}
async function dbPatchFields(id, fields) {
  const rows = await sbFetch(`figures?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(fields) });
  return fromRow(rows[0]);
}

async function dbUpdate(id, fig) {
  const rows = await sbFetch(`figures?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(toRow(fig)) });
  return fromRow(rows[0]);
}

async function dbDelete(id) {
  await sbFetch(`figures?id=eq.${id}`, { method: 'DELETE' });
}

// ── STORAGE HELPERS ───────────────────────────────────────────────────────────
async function uploadImage(dataUrl) {
  // Convert base64 dataUrl → blob
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  const ext = blob.type.split('/')[1] || 'jpg';
  const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;

  const uploadRes = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, Authorization: `Bearer ${currentAccessToken || SB_KEY}`,
               'Content-Type': blob.type, 'x-upsert': 'false' },
    body: blob
  });
  if (!uploadRes.ok) throw new Error(await uploadRes.text());
  return path; // store path, generate signed URL on display
}

async function getSignedUrl(path) {
  // Always sign with the anon key, never the signed-in user's own access token.
  // Viewing images is a public, read-only action (proven to work fine for
  // signed-out visitors), and swapping in the admin's personal token here was
  // actually breaking it: this project's storage bucket policy grants read
  // access to the "anon" role specifically, not "authenticated", so a signed-in
  // request carrying the admin's own token was being rejected while an
  // anonymous one succeeded — the opposite of what you'd expect.
  const res = await fetch(`${SB_URL}/storage/v1/object/sign/${BUCKET}/${path}`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ expiresIn: 3600 })
  });
  if (!res.ok) return null;
  const data = await res.json();
  return `${SB_URL}/storage/v1${data.signedURL}`;
}

// Cache signed URLs so we don't re-request on every render
const urlCache = {};
async function getCachedUrl(path) {
  if (!path) return null;
  if (path.startsWith('data:')) return path; // still a local base64 (pre-upload)
  if (urlCache[path] && urlCache[path].exp > Date.now()) return urlCache[path].url;
  const url = await getSignedUrl(path);
  if (url) urlCache[path] = { url, exp: Date.now() + 3500000 };
  return url;
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function handleSession(user, accessToken) {
  if (user && user.email !== ALLOWED_EMAIL) {
    currentUser = null; currentAccessToken = null;
    await sbClient.auth.signOut();
    toast('Access restricted — this collection is private.', 'error');
    return;
  }
  currentUser = user || null;
  currentAccessToken = accessToken || null;
  render();
}

async function signIn() {
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: SITE_URL }
  });
  if (error) toast('Sign in failed: ' + error.message, 'error');
}

async function signOut() {
  await sbClient.auth.signOut();
  currentUser = null; currentAccessToken = null;
  toast('Signed out', 'info');
  render();
}

// Listen for auth state changes (handles redirect back from Google)
sbClient.auth.onAuthStateChange((_event, session) => {
  handleSession(session?.user || null, session?.access_token || null);
});

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  // Check existing session immediately
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) { currentUser = session.user; currentAccessToken = session.access_token; }

  // Check for local data to migrate
  try {
    const local = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    if (local.length > 0) hasMigrateable = local;
  } catch {}

  render();
  try {
    collection = await dbFetch();
    syncStatus = 'ok';
  } catch (e) {
    syncStatus = 'err';
    toast('Could not reach Supabase — check your connection', 'error');
    console.error(e);
  }
  loading = false;
  render();
}

// ── MIGRATE LOCAL → SUPABASE ──────────────────────────────────────────────────
async function migrateLocal() {
  const local = hasMigrateable;
  if (!local || !local.length) return;
  syncStatus = 'busy'; render();
  let ok = 0, fail = 0;
  for (const fig of local) {
    try {
      // Upload any base64 images first
      const uploadedPaths = [];
      for (const img of (fig.images || [])) {
        if (img.startsWith('data:')) {
          const path = await uploadImage(img);
          uploadedPaths.push(path);
        } else {
          uploadedPaths.push(img);
        }
      }
      const migrated = { ...fig, images: uploadedPaths };
      delete migrated.id; // let Supabase generate a new UUID
      await dbInsert(migrated);
      ok++;
    } catch { fail++; }
  }
  collection = await dbFetch();
  syncStatus = 'ok';
  hasMigrateable = false;
  localStorage.removeItem(LS_KEY);
  toast(`Migrated ${ok} figure${ok!==1?'s':''}${fail?` (${fail} failed)`:''}`, ok>0?'success':'error');
  render();
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function genId() { return 'tmp_' + Date.now(); }

function filteredCollection() {
  return collection.filter(f => {
    if (filterStatus !== 'all' && (f.status||'owned') !== filterStatus) return false;
    if (filterFaction !== 'all' && f.faction !== filterFaction) return false;
    if (filterYear !== 'all' && String(f.year) !== filterYear) return false;
    if (filterSubgroup !== 'all' && f.subgroup !== filterSubgroup) return false;
    if (filterVehicle && !f.vehicle) return false;
    if (search) {
      const q = search.toLowerCase();
      if (!f.name.toLowerCase().includes(q) && !(f.subgroup||'').toLowerCase().includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    if (sort==='year') return (a.year||0)-(b.year||0);
    if (sort==='name') return a.name.localeCompare(b.name);
    if (sort==='condition') return (b.condition||5)-(a.condition||5);
    if (sort==='faction') return a.faction.localeCompare(b.faction);
    return 0;
  });
}

function pipClass(val, faction) {
  if (val >= 8) return faction==='GI Joe' ? 'on-joe' : 'on-cobra';
  return 'on-amber';
}

function accStatus(f) {
  const list = f.accessories||[];
  const owned = f.accessoriesOwned||[];
  const missing = list.filter(a=>!owned.includes(a));
  if (list.length === 0 || missing.length === 0) return {text:'Complete', cls:'complete', missing:[]};
  return {text:`${owned.length}/${list.length}`, cls:'missing', missing};
}

// Unique sub-group values seen so far in the collection — used to power the
// autocomplete suggestions in the add/edit form.
function knownSubgroups() {
  const set = new Set();
  collection.forEach(f => { if (f.subgroup) set.add(f.subgroup); });
  return Array.from(set).sort();
}

// Escape a string for safe use inside an HTML attribute (e.g. title="...").
function escAttr(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Resolve image paths → displayable URLs (async, patches DOM directly)
async function resolveCardImages() {
  // Each image is resolved independently (in parallel, each wrapped in its own
  // try/catch) rather than one at a time in a shared loop. Previously a single
  // failed sign request (a transient network hiccup, a slow/cold response,
  // anything that made that one fetch reject) threw out of the whole loop and
  // silently left every image AFTER it in the DOM stuck blank — with nothing
  // to retry them until some unrelated state change happened to trigger
  // another full render(). A lone quiet retry is also given to each image
  // before giving up, so a one-off blip resolves itself on the same pass.
  const imgs = document.querySelectorAll('[data-img-path]');
  await Promise.all(Array.from(imgs).map(async el => {
    const path = el.dataset.imgPath;
    try {
      let url = await getCachedUrl(path);
      if (!url) url = await getCachedUrl(path); // one retry
      if (url) { el.src = url; el.style.display = ''; }
    } catch (e) {
      console.error('Could not resolve image', path, e);
    }
  }));
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  // Every render() rebuilds the whole app from a string, which normally kicks
  // focus out of whatever input the user was typing in. Snapshot focus + cursor
  // position first and restore it after, so e.g. typing in the search box or
  // the add/edit form doesn't get interrupted after a single character.
  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id ? activeEl.id : null;
  const canSelect = activeEl && typeof activeEl.selectionStart === 'number';
  const selStart = canSelect ? activeEl.selectionStart : null;
  const selEnd   = canSelect ? activeEl.selectionEnd   : null;

  document.getElementById('root').innerHTML = buildApp();
  bindEvents();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && typeof el.setSelectionRange === 'function') {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }

  // Async resolve images after paint
  setTimeout(resolveCardImages, 0);
}

// Groups figures into consecutive runs sharing the same year (in whatever order
// `items` is already sorted in) so the grid can break onto a fresh row per year
// with a header denoting the year change, rather than one continuous grid.
function buildGrid(items) {
  if (!items.length) return '';
  const groups = [];
  items.forEach(f => {
    const last = groups[groups.length-1];
    if (last && last.year === f.year) last.items.push(f);
    else groups.push({ year: f.year, items: [f] });
  });
  return groups.map(g => `
    <div class="year-divider">
      <span class="year-divider-label">${g.year || 'Year unknown'}</span>
      <span class="year-divider-count">${g.items.length} figure${g.items.length!==1?'s':''}</span>
      <span class="year-divider-line"></span>
    </div>
    <div class="card-grid">${g.items.map(figCardHtml).join('')}</div>`
  ).join('');
}

// Larger-image viewer, independent of the add/edit modal. Reuses the same
// data-img-path + resolveCardImages() mechanism the cards use, so it doesn't
// need its own URL-resolving logic — it just drops another [data-img-path]
// element into the DOM and the existing resolver picks it up after paint.
function buildLightbox() {
  const fig = collection.find(f=>f.id===lightbox.figureId);
  const imgs = fig ? (fig.images||[]) : [];
  if (!fig || !imgs.length) return '';
  const idx = Math.min(Math.max(lightbox.index,0), imgs.length-1);
  const path = imgs[idx];
  return `
  <div class="lightbox-backdrop" id="lightbox-backdrop">
    <div class="lightbox">
      <div class="lightbox-header">
        <div class="lightbox-title">${fig.name}${imgs.length>1?`<span class="lightbox-count">${idx+1} / ${imgs.length}</span>`:''}</div>
        <button class="modal-close" id="lightbox-close">✕</button>
      </div>
      <div class="lightbox-body">
        ${imgs.length>1?`<button class="lightbox-nav" id="lightbox-prev" aria-label="Previous photo">‹</button>`:''}
        <div class="lightbox-img-wrap">
          <img class="lightbox-img" data-img-path="${path}" src="" alt="${fig.name}" style="display:none"/>
        </div>
        ${imgs.length>1?`<button class="lightbox-nav" id="lightbox-next" aria-label="Next photo">›</button>`:''}
      </div>
      ${imgs.length>1?`<div class="lightbox-thumbs">${imgs.map((p,i)=>`
        <button class="lightbox-thumb ${i===idx?'active':''}" data-thumb-idx="${i}">
          <img data-img-path="${p}" src="" style="display:none"/>
        </button>`).join('')}</div>`:''}
    </div>
  </div>`;
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
function bindEvents() {
  q('search')?.addEventListener('input', e=>{search=e.target.value;render();});
  q('search')?.addEventListener('keydown', e=>{if(e.key==='Escape'&&search){search='';render();}});
  q('search-clear')?.addEventListener('click', ()=>{search='';render();q('search')?.focus();});
  q('btn-add')?.addEventListener('click', openAdd);
  q('btn-add2')?.addEventListener('click', openAdd);
  q('btn-export-csv')?.addEventListener('click', exportCsv);
  q('btn-import-csv')?.addEventListener('click', () => q('f-import-csv')?.click());
  q('f-import-csv')?.addEventListener('change', e=>{
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => { importCsvText(ev.target.result); e.target.value = ''; };
    reader.readAsText(file);
  });
  q('vg')?.addEventListener('click', ()=>{view='grid';render();});
  q('vl')?.addEventListener('click', ()=>{view='list';render();});
  q('sort')?.addEventListener('change', e=>{sort=e.target.value;render();});
  q('btn-migrate')?.addEventListener('click', migrateLocal);
  q('btn-migrate-dismiss')?.addEventListener('click', ()=>{hasMigrateable=false;render();});

  // Auth
  document.getElementById('btn-signin')?.addEventListener('click', signIn);
  document.getElementById('btn-signout')?.addEventListener('click', signOut);
  document.getElementById('auth-btn')?.addEventListener('click', () => {
    const menu = document.getElementById('auth-menu');
    if (menu) menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  });
  document.addEventListener('click', e => {
    const wrap = document.getElementById('auth-wrap');
    const menu = document.getElementById('auth-menu');
    if (wrap && menu && !wrap.contains(e.target)) menu.style.display = 'none';
  }, { once: false });

  document.querySelectorAll('[data-fst]').forEach(el=>el.addEventListener('click',()=>{filterStatus=el.dataset.fst;render();}));
  document.querySelectorAll('[data-ff]').forEach(el=>el.addEventListener('click',()=>{filterFaction=el.dataset.ff;render();}));
  document.querySelectorAll('[data-fy]').forEach(el=>el.addEventListener('click',()=>{filterYear=el.dataset.fy;render();}));
  document.querySelectorAll('[data-fs]').forEach(el=>el.addEventListener('click',()=>{filterSubgroup=el.dataset.fs;render();}));
  document.querySelectorAll('[data-fveh]').forEach(el=>el.addEventListener('click',()=>{filterVehicle=!filterVehicle;render();}));

  document.querySelectorAll('.fig-card[data-id]').forEach(el=>el.addEventListener('click',e=>{if(!e.target.closest('.edit-btn'))openEdit(el.dataset.id);}));
  document.querySelectorAll('.list-row[data-id]').forEach(el=>el.addEventListener('click',e=>{if(!e.target.closest('.edit-btn'))openEdit(el.dataset.id);}));
  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();openEdit(el.dataset.edit);}));
  document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();openLightbox(el.dataset.view,0);}));

  if (lightbox) {
    q('lightbox-close')?.addEventListener('click', closeLightbox);
    q('lightbox-backdrop')?.addEventListener('click', e=>{if(e.target.id==='lightbox-backdrop')closeLightbox();});
    q('lightbox-prev')?.addEventListener('click', ()=>lightboxStep(-1));
    q('lightbox-next')?.addEventListener('click', ()=>lightboxStep(1));
    document.querySelectorAll('[data-thumb-idx]').forEach(btn=>btn.addEventListener('click', ()=>{lightbox={...lightbox, index:parseInt(btn.dataset.thumbIdx)};render();}));
  }

  if (modal) {
    q('mc')?.addEventListener('click', closeModal);
    q('btn-cancel')?.addEventListener('click', closeModal);
    q('backdrop')?.addEventListener('click', e=>{if(e.target.id==='backdrop')closeModal();});
    q('btn-save')?.addEventListener('click', saveFig);
    q('btn-del')?.addEventListener('click', delFig);

    // Keep F in sync as the user types/selects, so an intermediate render()
    // (e.g. clicking a condition pip) never wipes out unsaved field values —
    // buildModal() always renders inputs from F, so F has to stay current.
    q('f-name')?.addEventListener('input', e=>{F.name=e.target.value;});
    q('f-codename')?.addEventListener('input', e=>{F.codename=e.target.value;});
    q('f-faction')?.addEventListener('change', e=>{F.faction=e.target.value;render();});
    q('f-status')?.addEventListener('change', e=>{F.status=e.target.value;});
    q('f-year')?.addEventListener('change', e=>{F.year=e.target.value?parseInt(e.target.value):null;});
    q('f-subgroup')?.addEventListener('input', e=>{F.subgroup=e.target.value;});
    q('f-vehicle')?.addEventListener('input', e=>{F.vehicle=e.target.value;});
    q('f-notes')?.addEventListener('input', e=>{F.notes=e.target.value;});
    q('f-acc-input')?.addEventListener('input', e=>{
      F.accessories=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);
    });

    document.querySelectorAll('[data-cond]').forEach(btn=>btn.addEventListener('click',()=>{F.condition=parseInt(btn.dataset.cond);render();}));

    q('f-acc-input')?.addEventListener('blur', e=>{
      const newList=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);
      F.accessories=newList;
      F.accessoriesOwned=(F.accessoriesOwned||[]).filter(a=>newList.includes(a));
      render();
    });

    document.querySelectorAll('[data-acc]').forEach(cb=>cb.addEventListener('change',()=>{
      const a=cb.dataset.acc;
      F.accessoriesOwned=F.accessoriesOwned||[];
      if(cb.checked){if(!F.accessoriesOwned.includes(a))F.accessoriesOwned.push(a);}
      else{F.accessoriesOwned=F.accessoriesOwned.filter(x=>x!==a);}
    }));

    q('f-img')?.addEventListener('change', e=>{
      Array.from(e.target.files).forEach(file=>{
        const r=new FileReader();
        r.onload=ev=>{F.images=[...(F.images||[]),ev.target.result];render();};
        r.readAsDataURL(file);
      });
    });

    document.querySelectorAll('[data-di]').forEach(btn=>btn.addEventListener('click',e=>{
      e.stopPropagation();F.images.splice(parseInt(btn.dataset.di),1);render();
    }));

    // Resolve modal thumbnail images
    setTimeout(resolveCardImages, 0);
  }
}

function q(id){return document.getElementById(id);}

function readForm() {
  return {
    name:             q('f-name')?.value.trim()||F.name||'',
    codename:         q('f-codename')?.value.trim()||'',
    faction:          q('f-faction')?.value||'GI Joe',
    status:           q('f-status')?.value||'owned',
    year:             parseInt(q('f-year')?.value)||null,
    subgroup:         q('f-subgroup')?.value.trim()||'',
    vehicle:          q('f-vehicle')?.value.trim()||'',
    condition:        F.condition||7,
    accessories:      (q('f-acc-input')?.value||'').split(',').map(s=>s.trim()).filter(Boolean),
    accessoriesOwned: F.accessoriesOwned||[],
    // No longer editable in the form — carry through whatever was already on
    // the record (if anything) instead of re-reading a now-removed input, so
    // saving an existing figure doesn't quietly blank out old acquisition data.
    acquisitionDate:  F.acquisitionDate||'',
    acquisitionPrice: F.acquisitionPrice||'',
    notes:            q('f-notes')?.value||'',
    images:           F.images||[],
  };
}

function openAdd(){F={condition:7,accessories:[],accessoriesOwned:[],images:[],faction:'GI Joe',status:'owned'};modal='add';editId=null;render();}
function openEdit(id){
  const fig=collection.find(f=>f.id===id);
  if(!fig)return;
  F={...fig,accessories:[...(fig.accessories||[])],accessoriesOwned:[...(fig.accessoriesOwned||[])],images:[...(fig.images||[])]};
  modal='edit';editId=id;render();
}
function closeModal(){modal=null;editId=null;render();}

function openLightbox(figureId, index){ lightbox={figureId, index:index||0}; render(); }
function closeLightbox(){ lightbox=null; render(); }
function lightboxStep(delta){
  if (!lightbox) return;
  const fig = collection.find(f=>f.id===lightbox.figureId);
  const n = fig ? (fig.images||[]).length : 0;
  if (!n) return;
  lightbox = { ...lightbox, index: (lightbox.index + delta + n) % n };
  render();
}

async function saveFig() {
  if (!isAdmin()) { toast('Sign in to save changes', 'error'); return; }
  const data = readForm();
  if (!data.name){toast('Name is required','error');return;}

  // Upload any new base64 images → storage paths
  syncStatus='busy'; render();
  try {
    const resolvedImages = [];
    for (const img of data.images) {
      if (img.startsWith('data:')) {
        const path = await uploadImage(img);
        resolvedImages.push(path);
      } else {
        resolvedImages.push(img);
      }
    }
    data.images = resolvedImages;

    if (modal==='add') {
      const saved = await dbInsert(data);
      collection.push(saved);
      toast(`${data.name} added`,'success');
    } else {
      const saved = await dbUpdate(editId, data);
      const i = collection.findIndex(f=>f.id===editId);
      if (i>-1) collection[i] = saved;
      toast(`${data.name} updated`,'success');
    }
    syncStatus='ok';
    closeModal();
  } catch(e) {
    // Keep the modal open on failure — closing it here used to silently discard
    // everything the user had typed/uploaded (including new photos) even though
    // nothing had actually reached Supabase, making a failed save look successful.
    syncStatus='err';
    const detail = (e && e.message) ? e.message : 'Unknown error';
    toast(`Save failed — nothing was saved. ${detail}`, 'error', 8000);
    console.error(e);
    render();
  }
}

async function delFig() {
  if (!isAdmin()) { toast('Sign in to make changes', 'error'); return; }
  if (!confirm('Remove this figure from your collection?')) return;
  const fig = collection.find(f=>f.id===editId);
  syncStatus='busy'; render();
  try {
    await dbDelete(editId);
    collection = collection.filter(f=>f.id!==editId);
    syncStatus='ok';
    toast(`${fig?.name||'Figure'} removed`,'error');
    closeModal();
  } catch(e) {
    syncStatus='err';
    const detail = (e && e.message) ? e.message : 'Unknown error';
    toast(`Delete failed — ${detail}`,'error', 8000);
    console.error(e);
    render();
  }
}

// ── CSV EXPORT / IMPORT ──────────────────────────────────────────────────────
// Round-trip design: the CSV is authoritative for catalog fields (name,
// codename, faction, year, subgroup, vehicle), accessories, accessories_owned
// and status — import always overwrites these from the file. Condition,
// photos, notes and acquisition date/price are exclusively app-managed and
// are never touched by import (new rows get sane defaults; existing rows
// keep whatever they already have via dbPatchFields, which only sends the
// fields listed below).
function csvEscape(v) {
  const s = (v===null||v===undefined) ? '' : String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportCsv() {
  const headers = ['name','codename','faction','year','subgroup','vehicle','accessories','accessories_owned','status'];
  const lines = [headers.join(',')];
  collection.forEach(f => {
    const row = [
      f.name||'',
      f.codename||'',
      f.faction||'',
      f.year||'',
      f.subgroup||'',
      f.vehicle||'',
      (f.accessories||[]).join(';'),
      (f.accessoriesOwned||[]).join(';'),
      f.status||'owned',
    ];
    lines.push(row.map(csvEscape).join(','));
  });
  const csv = lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gijoe-vault-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV exported', 'success');
}

// RFC4180-ish parser: handles quoted fields with embedded commas, newlines
// and escaped ("") quotes, so a multi-line note or a name containing a comma
// in the source spreadsheet survives the round trip.
function parseCsvText(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false, i = 0;
  const len = text.length;
  while (i < len) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && String(r[0]).trim() === ''));
}

function normalizeStatus(s) {
  const v = String(s||'').trim().toLowerCase().replace(/[\s-]+/g,'_');
  if (v === 'wanted' || v === 'want') return 'wanted';
  if (v === 'out_of_budget' || v === 'oob') return 'out_of_budget';
  return 'owned';
}

function normalizeFaction(s) {
  return String(s||'').trim().toLowerCase() === 'cobra' ? 'Cobra' : 'GI Joe';
}

function normKey(s) { return String(s===null||s===undefined?'':s).trim().toLowerCase(); }

async function importCsvText(text) {
  if (!isAdmin()) { toast('Sign in to import', 'error'); return; }
  const rowsRaw = parseCsvText(text);
  if (rowsRaw.length < 2) { toast('CSV appears empty', 'error'); return; }
  const headerRow = rowsRaw[0].map(h => String(h||'').trim().toLowerCase().replace(/\s+/g,'_'));
  const dataRows = rowsRaw.slice(1);

  let inserted = 0, updated = 0, errors = 0;
  syncStatus = 'busy'; render();

  for (const r of dataRows) {
    if (r.every(c => String(c||'').trim()==='')) continue; // skip blank rows
    const obj = {};
    headerRow.forEach((h,idx) => { obj[h] = r[idx] !== undefined ? r[idx] : ''; });
    if (!obj.name || !String(obj.name).trim()) { errors++; continue; }

    const accessories = obj.accessories ? String(obj.accessories).split(';').map(s=>s.trim()).filter(Boolean) : [];
    const accessoriesOwnedRaw = obj.accessories_owned ? String(obj.accessories_owned).split(';').map(s=>s.trim()).filter(Boolean) : [];
    const payload = {
      name:              String(obj.name).trim(),
      codename:          obj.codename ? String(obj.codename).trim() : null,
      faction:           normalizeFaction(obj.faction),
      year:              obj.year ? (parseInt(obj.year) || null) : null,
      subgroup:          obj.subgroup ? String(obj.subgroup).trim() : null,
      vehicle:           obj.vehicle ? String(obj.vehicle).trim() : null,
      accessories:       accessories,
      // Only counts an owned accessory if it exactly matches a name in the
      // accessories column — guards against a typo'd owned-list silently
      // introducing an accessory that isn't otherwise tracked for the figure.
      accessories_owned: accessoriesOwnedRaw.filter(a => accessories.includes(a)),
      status:            normalizeStatus(obj.status),
    };

    const match = collection.find(f =>
      normKey(f.name) === normKey(payload.name) &&
      normKey(f.codename) === normKey(payload.codename) &&
      normKey(f.year) === normKey(payload.year)
    );

    try {
      if (match) {
        const saved = await dbPatchFields(match.id, payload);
        const i = collection.findIndex(f=>f.id===match.id);
        if (i>-1) collection[i] = saved;
        updated++;
      } else {
        const saved = await dbInsertFields({ ...payload, condition: 7, images: [] });
        collection.push(saved);
        inserted++;
      }
    } catch(e) {
      console.error('CSV row import failed for', payload.name, e);
      errors++;
    }
  }

  syncStatus = 'ok';
  toast(`Import complete — ${inserted} added, ${updated} updated${errors?`, ${errors} error${errors!==1?'s':''} (see console)`:''}`, errors?'error':'success', 8000);
  render();
}

function toast(msg,type='info',duration){
  const t={msg,type,id:Date.now()+Math.random()};
  toasts.push(t);
  render();
  setTimeout(()=>{toasts=toasts.filter(x=>x.id!==t.id);render();},duration||3500);
}

// Registered once (not inside bindEvents/render, which run on every state
// change) so keyboard navigation for the lightbox doesn't fire once per
// past render — it just checks the current `lightbox` state each press.
document.addEventListener('keydown', e => {
  if (!lightbox) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowRight') lightboxStep(1);
  else if (e.key === 'ArrowLeft') lightboxStep(-1);
});

init();
</script>
